[defaults]
inventory         = inventory/hosts.ini
roles_path        = roles
remote_user       = ubuntu
private_key_file  = ~/.ssh/phase1-key
stdout_callback   = yaml
# Disabling host key checking is acceptable for a portfolio lab where
# instances are destroyed and recreated frequently. In production,
# pre-populate known_hosts and set this to True.
host_key_checking = False

[ssh_connection]
# pipelining reduces the number of SSH connections per task and speeds up runs.
pipelining = True
ssh_args   = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=300s
