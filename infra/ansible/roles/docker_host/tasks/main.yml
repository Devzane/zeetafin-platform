---
# VERIFY before running: confirm the Docker GPG key URL and repo still match
# the official Docker documentation at https://docs.docker.com/engine/install/ubuntu/
# Docker occasionally rotates repository details.

- name: Install apt prerequisites for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    # update_cache: false — cache was refreshed in site.yml pre_tasks
    update_cache: false

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    # force: false — idempotent: skip download if the file already exists
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    # ansible_distribution_release resolves to 'noble' on Ubuntu 24.04
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker CE and official plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
  # NOTE: The group change takes effect for NEW login sessions only.
  # During this Ansible run, commands under `become_user: ubuntu` that
  # call docker will still need `become: true` (root) unless you log out and back in.

# This task is intentionally NOT fully idempotent.
# `docker run` always executes and always reports changed=1 because
# `ansible.builtin.command` has no way to determine "Docker works correctly"
# without running it. A second run will also show changed=1 for this task only.
# All other tasks in this role will show changed=0 on re-run.
- name: Verify Docker is functional by running hello-world
  ansible.builtin.command:
    cmd: docker run --rm hello-world
  changed_when: true
  become: true
