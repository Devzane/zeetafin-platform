name: "CI - Frontend (Next.js)"

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  validate-frontend:
    name: "Lint, Typecheck & Standalone Build"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "apps/frontend/package-lock.json"

      - name: "Install Dependencies"
        working-directory: "apps/frontend"
        run: npm ci

      - name: "Verify Standalone Dockerfile Build"
        working-directory: "apps/frontend"
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api -t zeetafin-frontend:test .
