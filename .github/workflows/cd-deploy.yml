name: "CD - Production ECR Build & EC2 Deployment"

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "deploy/**"
      - ".github/workflows/cd-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment target"
        required: true
        default: "production"
      tag_override:
        description: "Optional container image tag override (defaults to commit SHA)"
        required: false
        default: ""

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job 1: Build Multi-Stage Docker Images & Push to Amazon ECR
  # ============================================================================
  build-and-push:
    name: "Build & Push Images to Amazon ECR"
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: "Checkout Application Code"
        uses: actions/checkout@v4

      - name: "Set Image Tag"
        id: set-tag
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            TAG="${{ github.event.inputs.tag_override }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building and releasing with Image Tag: ${TAG}"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Authenticate with AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: "Log in to Amazon Elastic Container Registry (ECR)"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build & Push Backend Container Image"
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/zeetafin-backend:${{ steps.set-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/zeetafin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Build & Push Frontend Container Image"
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.EC2_HOST }}:3001/api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/zeetafin-frontend:${{ steps.set-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/zeetafin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 2: Connect to EC2 Host & Execute Rolling Deployment Engine
  # ============================================================================
  deploy-to-ec2:
    name: "Deploy to AWS EC2 Infrastructure"
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Application Code"
        uses: actions/checkout@v4

      - name: "Authenticate with AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: "Authorize GitHub Runner IP in Security Group"
        id: ip-whitelist
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          echo "Temporarily whitelisting runner IP ${RUNNER_IP} on port 22..."
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"

      - name: "Configure Secure SSH Key"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "Sync Production Manifests and Operational Scripts"
        env:
          EC2_USER: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Syncing production compose manifests and deployment scripts..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "mkdir -p /home/${EC2_USER}/zeetafin-app/scripts"
          
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/docker-compose.prod.yml \
            "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/zeetafin-app/docker-compose.prod.yml"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/scripts/deploy.sh \
            "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/zeetafin-app/scripts/deploy.sh"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/scripts/rollback.sh \
            "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/zeetafin-app/scripts/rollback.sh"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/scripts/healthcheck.sh \
            "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/zeetafin-app/scripts/healthcheck.sh"

      - name: "Execute Deployment & Container Replacement on EC2"
        env:
          EC2_USER: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          # 1. Resolve Account ID and ECR Registry cleanly
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "Resolved ECR Registry: ${ECR_REGISTRY}"

          # 2. Get short-lived ECR Docker auth token directly on runner
          ECR_TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")

          echo "Connecting to EC2 server (${EC2_HOST}) to execute container rollout..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" << EOF
            set -euo pipefail
            cd /home/ubuntu/zeetafin-app
            chmod +x scripts/deploy.sh scripts/rollback.sh scripts/healthcheck.sh

            # Authenticate Docker on EC2 with the ECR token directly
            echo "${ECR_TOKEN}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            export ECR_REGISTRY="${ECR_REGISTRY}"
            export IMAGE_TAG="${IMAGE_TAG}"
            export NEXT_PUBLIC_API_URL="http://${EC2_HOST}:3001/api"

            # Execute deployment engine with resolved ECR Registry
            ./scripts/deploy.sh "${IMAGE_TAG}" "${ECR_REGISTRY}" "${AWS_REGION}"
          EOF

      - name: "Automated External Availability Smoke Check"
        run: |
          echo "Performing external health check against deployed application..."
          MAX_RETRIES=15
          WAIT_TIME=5
          SUCCESS=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Checking http://${{ secrets.EC2_HOST }}:3000..."
            if curl -s -f -m 10 "http://${{ secrets.EC2_HOST }}:3000" > /dev/null; then
              echo "Frontend is responding successfully on http://${{ secrets.EC2_HOST }}:3000!"
              SUCCESS=1
              break
            fi
            echo "Frontend not ready yet, sleeping ${WAIT_TIME}s..."
            sleep $WAIT_TIME
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Warning: Frontend probe did not respond with 200 OK within timeout. Please verify EC2 Security Group ingress rule for port 3000."
          fi

          echo "Deployment pipeline execution completed successfully!"

      - name: "Revoke GitHub Runner IP from Security Group"
        if: always()
        run: |
          if [ -n "${{ steps.ip-whitelist.outputs.runner_ip }}" ]; then
            echo "Revoking runner IP ${{ steps.ip-whitelist.outputs.runner_ip }} from Security Group..."
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.EC2_SG_ID }}" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.ip-whitelist.outputs.runner_ip }}/32" || true
          fi
