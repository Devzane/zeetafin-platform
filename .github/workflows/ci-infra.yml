name: "CI - Infrastructure (Terraform & Ansible)"

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/ci-infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/ci-infra.yml"

jobs:
  validate-infra:
    name: "Terraform Fmt, Validate & Lint"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive infra/terraform

      - name: "Validate Bootstrap State Module"
        working-directory: "infra/terraform/bootstrap"
        run: |
          terraform init -backend=false
          terraform validate

      - name: "Validate Networking Module"
        working-directory: "infra/terraform/modules/networking"
        run: |
          terraform init -backend=false
          terraform validate

      - name: "Validate Production Environment"
        working-directory: "infra/terraform/environments/prod"
        run: |
          terraform init -backend=false
          terraform validate
